[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firepit"
version = "3.0.0"
description = "Query-only STIX 2.1 threat-intelligence views backed by DuckDB."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "IBM Security", email = "pcoccoli@us.ibm.com" },
]
keywords = ["stix", "stix-shifter", "duckdb", "threat-hunting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = ["duckdb"]

[project.optional-dependencies]
ingest = [
    "stix2>=3.0.2,<4",
    "stix2-patterns>=2.1.2",
]
test = [
    "pytest>=8",
    "pytest-cov",
    "stix2>=3.0.2,<4",
    "stix2-patterns>=2.1.2",
]
release = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/zbalkan/firepit"
Repository = "https://github.com/zbalkan/firepit"
Issues = "https://github.com/zbalkan/firepit/issues"

[tool.setuptools.packages.find]
include = ["firepit", "firepit.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
